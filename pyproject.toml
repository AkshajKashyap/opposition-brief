[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opposition-brief"
version = "0.1.0"
description = "Evidence-linked soccer opposition analysis and match-preparation reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
opposition-brief = "opposition_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
